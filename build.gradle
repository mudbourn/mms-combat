plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Named dev clients for the two-player streak test; separate run dirs so two clients do not collide on files or logs.
loom {
    accessWidenerPath = file("src/main/resources/mms_combat.accesswidener")
    runs {
        clientAlice {
            client()
            name = "Client Alice"
            runDir = "run/alice"
            programArgs "--username", "Alice"
        }
        clientBob {
            client()
            name = "Client Bob"
            runDir = "run/bob"
            programArgs "--username", "Bob"
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

// Required mods that ship nested jars, loaded from the run mods folders where the loader unpacks them.
configurations {
    runtimeMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
    modImplementation "info.mudbourn:mms-render-common:${project.render_common_version}"
    runtimeMods "maven.modrinth:better-combat:${project.better_combat_version}"
    runtimeMods "maven.modrinth:player-animation-library:${project.player_animation_library_version}"
    // Just Enough Guns is the source of the ranged killstreak rewards; local jar (no Maven),
    // compiled against and copied into the dev run mods folders but not declared as a dependency of the mod.
    modCompileOnly files("libs/justenoughguns-fabric-1.4.0.jar")
    runtimeMods files("libs/justenoughguns-fabric-1.4.0.jar")
    // GeckoLib is JEG's own required dependency, provided the same way.
    modCompileOnly files("libs/geckolib-fabric-1.21.11-5.4.5.jar")
    runtimeMods files("libs/geckolib-fabric-1.21.11-5.4.5.jar")
    // Night Config core, which JEG's bundled toml jar needs but JEG does not ship.
    localRuntime "com.electronwill.night-config:core:3.8.1"
    // Client-only Mojang library that Bren logs through on the server tick; bundle it so a
    // dedicated server has the class and does not crash, and add it to the dev server run's
    // library set, which loom otherwise strips of client-only libraries.
    include "com.mojang:text2speech:1.18.11"
    minecraftServerRuntimeLibraries "com.mojang:text2speech:1.18.11"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    // Pin a JDK 21 toolchain so compile and runClient fork on a supported
    // HotSpot JVM instead of whatever launched Gradle. Matches the other mms mods.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

processResources {
    // declare the version as an input so bumping gradle.properties
    // invalidates the task (expand values are not tracked automatically)
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Sibling mms-origins is a runtime-only mod loaded from run/mods, not a build dependency.
def mmsSiblingRoot = providers.gradleProperty("mmsSiblingRoot").getOrElse("..")
def originsDir = file("$mmsSiblingRoot/mms-origins")
def originsWrapper = System.getProperty("os.name").toLowerCase().contains("win") ? "gradlew.bat" : "./gradlew"

// Rebuilds the sibling mod so the dev runs never load a hand-copied, stale jar.
tasks.register("buildOriginsMod", Exec) {
    onlyIf { originsDir.exists() }
    workingDir originsDir
    commandLine originsWrapper, "build"
    inputs.dir(file("$originsDir/src"))
    outputs.dir(file("$originsDir/build/libs"))
}

// Replaces the mms-origins jar under run/mods with the one just built.
tasks.register("refreshOriginsMod", Copy) {
    dependsOn "buildOriginsMod"
    onlyIf { originsDir.exists() }
    doFirst {
        delete fileTree("run/mods") { include "mms-origins-*.jar" }
    }
    from(file("$originsDir/build/libs")) {
        include "mms-origins-*.jar"
        exclude "*-sources.jar"
    }
    into file("run/mods")
}

// Copies the required runtime mods into every dev run's mods folder.
tasks.register("syncRuntimeMods") {
    inputs.files(configurations.runtimeMods)
    doLast {
        ["run/mods", "run/alice/mods", "run/bob/mods"].each { dir ->
            copy {
                from configurations.runtimeMods
                into file(dir)
            }
        }
    }
}

// Refresh the sibling mod before any dev run so edits there take effect without a manual copy.
["runServer", "runClientAlice", "runClientBob"].each { runName ->
    tasks.named(runName) {
        dependsOn "refreshOriginsMod", "syncRuntimeMods"
    }
}
