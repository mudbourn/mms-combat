plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Named dev clients for the two-player streak test; separate run dirs so two clients do not collide on files or logs.
loom {
    accessWidenerPath = file("src/main/resources/mms_combat.accesswidener")
    runs {
        clientAlice {
            client()
            name = "Client Alice"
            runDir = "run/alice"
            programArgs "--username", "Alice"
        }
        clientBob {
            client()
            name = "Client Bob"
            runDir = "run/bob"
            programArgs "--username", "Bob"
        }
    }
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

// Required mods that ship nested jars, loaded from the run mods folders where the loader unpacks them.
configurations {
    runtimeMods {
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
    modImplementation "info.mudbourn:mms-render-common:${project.render_common_version}"
    // The Training Dummy registers its head hitbox with mms-weapons headshots.
    modImplementation "info.mudbourn:mms-weapons:${project.weapons_version}"
    // Absolute Revive is the downed state the self-revive compat hooks; optional, compiled against and copied into the dev run mods folders.
    modCompileOnly files("libs/absolutrevive-v1.2.1b.jar")
    runtimeMods files("libs/absolutrevive-v1.2.1b.jar")
    // Mods whose weapon models, tags or ids this mod overrides or references, loaded at runtime only.
    runtimeMods files(
        "libs/aerialhell-0.7.7.9_fabric1.21.11.jar",
        "libs/basicweapons-fabric-2.3.8+1.21.11.jar",
        "libs/bountiful-fish-1.1.1.jar",
        "libs/enderscape-fabric-2.1.0+mc1.21.11.jar",
        "libs/expanded_weaponry-0.8.jar",
        "libs/weaponsexpanded_1.21.11_1.9.3.1_fabric.jar"
    )
    // Required dependencies of Enderscape, Bountiful Fish, mms-arsenal and mms-weapons.
    runtimeMods files(
        "libs/trinkets-3.11.0-beta.2+1.21.11.jar",
        "libs/cardinal-components-api-7.3.2.jar",
        "libs/lithostitched-1.7.2-fabric-21.11.jar",
        "libs/yet_another_config_lib_v3-3.8.2+1.21.11-fabric.jar",
        "libs/better-combat-3.1.0+1.21.11-fabric.jar",
        "libs/cloth-config-21.11.153-fabric.jar",
        "libs/player-animation-library-1.1.10.jar",
        "libs/MutantMonsters-v21.11.2-mc1.21.11-Fabric.jar",
        "libs/PuzzlesLib-v21.11.13-mc1.21.11-Fabric.jar",
        "libs/ForgeConfigAPIPort-v21.11.1-mc1.21.11-Fabric.jar"
    )
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    // Pin a JDK 21 toolchain so compile and runClient fork on a supported
    // HotSpot JVM instead of whatever launched Gradle. Matches the other mms mods.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

processResources {
    // declare the version as an input so bumping gradle.properties
    // invalidates the task (expand values are not tracked automatically)
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Sibling mods loaded from the run mods folders, not build dependencies. mms-weapons is a build dependency now, so it is not listed here.
def mmsSiblingRoot = providers.gradleProperty("mmsSiblingRoot").getOrElse("..")
def siblingWrapper = System.getProperty("os.name").toLowerCase().contains("win") ? "gradlew.bat" : "./gradlew"
def siblingMods = ["mms-origins", "mms-arsenal"]

siblingMods.each { sibling ->
    def siblingDir = file("$mmsSiblingRoot/$sibling")
    def taskSuffix = sibling.split("-").collect { it.capitalize() }.join("")

    // Rebuilds the sibling mod so the dev runs never load a hand-copied, stale jar.
    tasks.register("build${taskSuffix}", Exec) {
        onlyIf { siblingDir.exists() }
        workingDir siblingDir
        commandLine siblingWrapper, "build"
        inputs.dir(file("$siblingDir/src"))
        outputs.dir(file("$siblingDir/build/libs"))
    }

    // Replaces the sibling jar in every dev run mods folder with the newest one just built.
    tasks.register("refresh${taskSuffix}") {
        dependsOn "build${taskSuffix}"
        onlyIf { siblingDir.exists() }
        doLast {
            def newest = fileTree("$siblingDir/build/libs") {
                include "${sibling}-*.jar"
                exclude "*-sources.jar"
            }.files.max { it.lastModified() }
            ["run/mods", "run/alice/mods", "run/bob/mods"].each { dir ->
                delete fileTree(dir) { include "${sibling}-*.jar" }
                if (newest != null) {
                    copy {
                        from newest
                        into file(dir)
                    }
                }
            }
        }
    }
}

// Copies the required runtime mods into every dev run's mods folder.
tasks.register("syncRuntimeMods") {
    inputs.files(configurations.runtimeMods)
    doLast {
        ["run/mods", "run/alice/mods", "run/bob/mods"].each { dir ->
            copy {
                from configurations.runtimeMods
                into file(dir)
            }
        }
    }
}

// Refresh the sibling mods and runtime mods before any dev run so edits there take effect without a manual copy.
["runClient", "runServer", "runClientAlice", "runClientBob"].each { runName ->
    tasks.named(runName) {
        dependsOn siblingMods.collect { "refresh" + it.split("-").collect { part -> part.capitalize() }.join("") }, "syncRuntimeMods"
    }
}
